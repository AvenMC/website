<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>AVENMC — December Playtest</title>
    <link rel="stylesheet" href="css/tokens.css?v=136">
    <link rel="stylesheet" href="css/playtest.css?v=8">
  </head>
  <body>
    <main class="poster">
      <header class="posterHeader">
        <img class="brand" src="assets/logoFull.png" alt="AVENMC">
        <div class="regionBadge">EU REGION ONLY</div>
      </header>

      <section class="posterContent" aria-label="Playtest announcement">
        <div class="announcement">
          <h1>PLAY<span>TEST.</span></h1>
        </div>

        <div class="modesArea">
          <div class="modesHeading"><h2>FREE FOR ALL</h2></div>
          <div class="modeGrid">
            <article class="mode sword">
              <img src="assets/icons/sword.png" alt="">
              <div><h3>Sword</h3><p>Classic vanilla combat</p></div>
            </article>
            <article class="mode crystal">
              <img src="assets/icons/crystal.png" alt="">
              <div><h3>CrystalPvP</h3><p>Crystals &amp; anchors</p></div>
            </article>
            <article class="mode mace">
              <img src="assets/icons/mace.png?v=2" alt="">
              <div><h3>Mace</h3><p>All mace combat styles</p></div>
            </article>
          </div>
        </div>
      </section>

      <footer class="schedule">
        <div class="scheduleDate"><span class="detailLabel">SATURDAY</span><strong>12.12.2026</strong></div>
        <div class="scheduleTime"><span class="detailLabel">TIME</span><strong>12:00 <span class="timeDash">—</span> 22:00 <span class="timezone">UTC</span></strong></div>
        <div class="scheduleServer"><span class="detailLabel">SERVER ADDRESS</span><strong>avenmc.net</strong><span class="serverPort">PORT 19132</span></div>
      </footer>
    </main>
  </body>
</html>
